<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://hibfipskhksboubibwbz.supabase.co https://cdn.jsdelivr.net; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Reset Admin Password | PureForm</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/pureform-admin.css">
  <style>
    [hidden] { display: none !important; }
    .recovery-shell { width: min(440px, 100%); min-height: 100vh; margin: auto; padding: 48px 24px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    .recovery-heading { display: grid; gap: 12px; }
    .recovery-heading h1 { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.2; }
    .recovery-shell .admin-form { margin: 0; }
    .recovery-shell input { min-width: 0; border-radius: 8px; font-size: 16px; }
    .recovery-shell .status-message { margin: 0; overflow-wrap: anywhere; }
    .recovery-shell .help-text { margin: 0; }
    .recovery-shell .password-visibility { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .password-visibility input { width: 18px; height: 18px; min-height: 18px; accent-color: #111111; }
    .recovery-footer { color: var(--mid); font-size: 13px; }
    @media (max-width: 480px) { .recovery-shell { padding: 32px 24px; gap: 24px; } .recovery-heading h1 { font-size: 28px; } }
  </style>
  <script src="../assets/pureform-supabase-config.js" defer></script>
  <script src="../assets/pureform-admin-recovery.js" defer></script>
</head>
<body>
  <main class="recovery-shell">
    <a class="admin-brand" href="../index.html" aria-label="PureForm homepage">PureForm</a>
    <header class="recovery-heading">
      <p class="eyebrow">Private Admin</p>
      <h1 id="recoveryTitle">Reset your password</h1>
    </header>
    <p id="recoveryStatus" class="status-message" role="status" aria-live="polite">Checking recovery link...</p>
    <form id="recoveryRequestForm" class="admin-form" hidden>
      <label for="recoveryEmail">Admin email</label>
      <input id="recoveryEmail" name="email" type="email" autocomplete="username" spellcheck="false" required>
      <button id="sendRecoveryButton" class="btn btn-primary full-width" type="submit">Send reset link</button>
    </form>
    <form id="recoveryPasswordForm" class="admin-form" hidden>
      <label for="new-password">New admin password</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="12" aria-describedby="passwordHelp" required disabled>
      <p id="passwordHelp" class="help-text">At least 12 characters.</p>
      <label class="password-visibility"><input id="showRecoveryPassword" type="checkbox">Show password</label>
      <button id="saveRecoveryButton" class="btn btn-primary full-width" type="submit" disabled>Save new password</button>
    </form>
    <noscript><p>JavaScript is required to reset your admin password.</p></noscript>
    <a id="recoverySignIn" class="recovery-footer" href="./">Back to admin sign in</a>
  </main>
</body>
</html>
